[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engrave2svg"
version = "0.1.0"
description = "OpenCV skeletonization pipeline for archaeological bitmap tracing to SVG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
  "scikit-image>=0.22",
  "svgwrite>=1.4",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
engrave2svg = "engrave2svg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
